{% extends 'base.html' %}
{% block title %}My Profile{% endblock %}
{% block content %}
<div class="page-header">
  <div class="container"><h2 style="font-family:'Playfair Display',serif;"><i class="bi bi-person me-2"></i>My Profile</h2></div>
</div>
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow">
        <div class="card-body p-4">
          <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {% if user.profile_picture %}
            <div class="text-center mb-4">
              <img src="{{ user.profile_picture.url }}" width="100" height="100" class="rounded-circle border" style="object-fit:cover;">
            </div>
            {% endif %}
            <div class="mb-3">
              <label class="form-label">Profile Picture</label>
              <input type="file" name="profile_picture" class="form-control" accept="image/*">
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">First Name</label>
                <input type="text" name="first_name" class="form-control" value="{{ user.first_name }}">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Last Name</label>
                <input type="text" name="last_name" class="form-control" value="{{ user.last_name }}">
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" name="email" class="form-control" value="{{ user.email }}">
            </div>
            <div class="mb-3">
              <label class="form-label">Phone</label>
              <input type="text" name="phone" class="form-control" value="{{ user.phone }}">
            </div>
            <div class="mb-4">
              <label class="form-label">Role</label>
              <input type="text" class="form-control" value="{{ user.get_role_display }}" disabled>
              <small class="text-muted">Only an admin can change your role, from Manage Users.</small>
            </div>
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
