{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="page-header text-center">
    <h2 style="font-family:'Playfair Display',serif;">Welcome Back</h2>
    <p class="opacity-75">Sign in to your Mercy Works account</p>
</div>
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow">
        <div class="card-header text-center py-3">
          <h5 class="mb-0"><i class="bi bi-person-circle me-2"></i>Sign In</h5>
        </div>
        <div class="card-body p-4">
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label fw-semibold">Username</label>
              <input type="text" name="username" class="form-control" placeholder="Enter username" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Password</label>
              <input type="password" name="password" class="form-control" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">
              <i class="bi bi-box-arrow-in-right me-2"></i>Login
            </button>
          </form>
          <hr>
          <p class="text-center mb-0">Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
