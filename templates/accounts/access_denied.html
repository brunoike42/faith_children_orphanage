{% extends 'base.html' %}
{% block title %}Access Denied{% endblock %}
{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow border-0">
        <div class="card-body py-5">
          <i class="bi bi-shield-exclamation text-danger" style="font-size:5rem;"></i>
          <h2 class="mt-3 fw-bold text-danger">Access Denied</h2>
          <p class="text-muted fs-5">You don't have permission to access this page.</p>
          <p class="text-muted">Please contact the administrator if you believe this is an error.</p>
          <a href="{% url 'home' %}" class="btn btn-primary px-4">
            <i class="bi bi-house me-2"></i>Go to Home
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
